services:
  # ============================================================
  # PostgreSQL with PostGIS + pgvector extensions
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: childsafety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-childsafety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-childsafety_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-childsafety}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-childsafety}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Redis — caching, sessions, queues, real-time events
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: childsafety-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Neo4j — knowledge graph for cross-case intelligence
  # ============================================================
  neo4j:
    image: neo4j:5-community
    container_name: childsafety-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-childsafety_neo4j_2024}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"   # Browser UI
      - "${NEO4J_BOLT_PORT:-7687}:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # MinIO — S3-compatible object storage for evidence files
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: childsafety-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-childsafety_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-childsafety_minio_secret_2024}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"    # API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================================
  # Backend — FastAPI application server
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: childsafety-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-childsafety}:${POSTGRES_PASSWORD:-childsafety_dev_2024}@postgres:5432/${POSTGRES_DB:-childsafety}
      REDIS_URL: redis://redis:6379/0
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-childsafety_neo4j_2024}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-childsafety_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-childsafety_minio_secret_2024}
      AI_SERVER_URL: http://ai_server:8001
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================
  # AI Server — ML inference server
  # ============================================================
  ai_server:
    build:
      context: ./ai_server
      dockerfile: Dockerfile
    container_name: childsafety-ai-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DEVICE: ${AI_DEVICE:-cpu}
      BACKEND_URL: http://backend:8000
      MODEL_STORE_PATH: /app/model_store
    ports:
      - "${AI_SERVER_PORT:-8001}:8001"
    volumes:
      - ./ai_server:/app
      - model_store:/app/model_store
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    # Uncomment below for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  postgres_data:
  redis_data:
  neo4j_data:
  neo4j_logs:
  minio_data:
  model_store:
